<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NOCLIP — Aventure dans les Backrooms</title>
  <link rel="stylesheet" href="style.css">
</head>

<body class="player">
  <!-- Un seul lecteur audio pour tout le site. -->
  <audio id="ambiance" loop preload="none" hidden>
    <source src="assets/sounds/feldup.mp3" type="audio/mpeg">
  </audio>

  <main class="player-main">
    <iframe
      id="cadre-jeu"
      class="cadre-jeu"
      title="Aventure NOCLIP"
    ></iframe>
  </main>

  <script>
    // Éviter de charger un deuxième lecteur si un ancien lien
    // ouvre accidentellement index.html dans le cadre.
    if (window.parent !== window) {
      window.location.replace("accueil.html");
    } else {
      const ambiance = document.getElementById("ambiance");
      const cadre = document.getElementById("cadre-jeu");

      ambiance.volume = 0.25;

      function arreterMusique() {
        ambiance.pause();
        ambiance.currentTime = 0;
      }

      function commencerAventure() {
        ambiance.currentTime = 0;

        ambiance.play().catch((erreur) => {
          console.error(
            "Lecture impossible : vérifie assets/sounds/feldup.mp3.",
            erreur
          );
        });

        cadre.src = "pages/niveau-0.html";
      }

      // Accepter uniquement les messages de notre cadre.
      window.addEventListener("message", (event) => {
        if (event.source !== cadre.contentWindow) {
          return;
        }

        if (event.data === "noclip:menu") {
          arreterMusique();
        }

        if (event.data === "noclip:commencer") {
          commencerAventure();
        }
      });

      // Charger le menu après avoir installé les commandes.
      cadre.src = "accueil.html";
    }
  </script>
</body>
</html>
